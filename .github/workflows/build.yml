name: Native desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Test backend
        run: go test ./internal/...
      - name: Test native portable core without a system OpenConnect installation
        env:
          CUHK_NETWORK_TEST: '1'
        run: go test ./internal/core -run TestNativePortableCore -v -count=1
      - name: Build Windows
        if: runner.os == 'Windows'
        run: wails build
      - name: Build Windows ARM64 GUI (x64 core uses OS emulation)
        if: runner.os == 'Windows'
        run: wails build -platform windows/arm64 -o CuhkVpn-arm64.exe
      - name: Build universal macOS app
        if: runner.os == 'macOS'
        run: wails build -platform darwin/universal
      - name: Build Linux
        if: runner.os == 'Linux'
        run: wails build -tags webkit2_41
      - name: Upload native application
        uses: actions/upload-artifact@v4
        with:
          name: cuhk-vpn-${{ runner.os }}
          path: build/bin/
